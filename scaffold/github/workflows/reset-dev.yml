# Resets dev to the default branch after every release (a YYYY-MM-DD-N tag), and merges back the
# open pull requests that were on it. Can also be run by hand from the Actions tab.
# The logic lives in happiness/drupal-project, see its docs/workflow.md.
name: reset-dev

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*']
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: reset-dev

jobs:
  reset-dev:
    uses: happiness/drupal-project/.github/workflows/reset-dev.yml@main
